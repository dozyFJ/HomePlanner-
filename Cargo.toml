[package]
name = "wolfcraft-home-planner"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
egui = "0.29.1"
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "22.1"
winit = "0.30.13"
wolfcraft-assets = { git = "https://github.com/dozyFJ/WolfCraft.git", rev = "80ca806c141d91edf74fde2b861a68214c6f0edb" }
wolfcraft-common = { git = "https://github.com/dozyFJ/WolfCraft.git", rev = "80ca806c141d91edf74fde2b861a68214c6f0edb" }
wolfcraft-engine = { git = "https://github.com/dozyFJ/WolfCraft.git", rev = "80ca806c141d91edf74fde2b861a68214c6f0edb" }
wolfcraft-ui = { git = "https://github.com/dozyFJ/WolfCraft.git", rev = "80ca806c141d91edf74fde2b861a68214c6f0edb" }


[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }

[profile.release]
strip = "symbols"
