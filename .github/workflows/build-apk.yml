name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Android NDK
        run: |
          NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"
            NDK_PATH="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "Selected NDK at: $NDK_PATH"

      - name: Build Rust Native Library
        run: |
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          
          cargo build --locked --release --lib --target aarch64-linux-android
          stage="android/app/build/rust-libs/arm64-v8a"
          mkdir -p "$stage"
          cp "target/aarch64-linux-android/release/libwolfcraft_home_planner.so" "$stage/"

      - name: Check / Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HOMEPLANNER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HOMEPLANNER_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/homeplanner.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Keystore restored successfully."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No signing keystore secret provided. Building unsigned release APK."
          fi

      - name: Build APK with Gradle
        env:
          HOMEPLANNER_KEYSTORE: ${{ steps.keystore.outputs.has_keystore == 'true' && '/tmp/homeplanner.keystore' || '' }}
          HOMEPLANNER_KEYSTORE_PASSWORD: ${{ secrets.HOMEPLANNER_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android --no-daemon --console=plain :app:assembleRelease

      - name: Locate output APK
        id: apk
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK not found!" >&2
            exit 1
          fi
          echo "path=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$APK_FILE")" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_FILE"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HomePlanner-0.1.12
          path: ${{ steps.apk.outputs.path }}

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp "${{ steps.apk.outputs.path }}" "HomePlanner-0.1.12.apk"
          gh release create "$TAG" "HomePlanner-0.1.12.apk" \
            --target "${{ github.sha }}" \
            --title "HomePlanner 0.1.12 (build ${{ github.run_number }})" \
            --notes "Сборка из ${{ github.ref_name }} @ ${{ github.sha }}" \
            --prerelease

      - name: Publish to OTA branch
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="${{ steps.apk.outputs.path }}"
          SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          COMMIT_SHA="${{ github.sha }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout ota
          mkdir -p releases
          cp "$APK_FILE" "releases/HomePlanner-0.1.12.apk"
          
          cat <<EOF > latest.json
          {
            "versionCode": 13,
            "versionName": "0.1.12",
            "url": "https://raw.githubusercontent.com/dozyFJ/HomePlanner-/ota/releases/HomePlanner-0.1.12.apk",
            "sha256": "$SHA256",
            "sourceCommit": "$COMMIT_SHA"
          }
          EOF
          
          git add releases/HomePlanner-0.1.12.apk latest.json
          git commit -m "Publish HomePlanner 0.1.12 OTA"
          git push origin ota
